  - training
  - nutrition
  - TCM
  - tongue
  - constitution
  - 运动
  - 性健康
  - 体重
triggers:
  - create my profile
  - log today's workout
  - what to eat today
  - nutrition advice
  - training plan
  - weekly summary
  - my constitution
  - tongue diagnosis
  - solar term wellness
  - weight tracking
  - health profile
